name: Public Swift sample tests

on:
  pull_request:
    paths:
      - 'samples/HabitEvidenceCore/**'
      - 'samples/CivilDayCore/**'
      - '.github/workflows/swift-sample-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'samples/HabitEvidenceCore/**'
      - 'samples/CivilDayCore/**'
      - '.github/workflows/swift-sample-tests.yml'

permissions:
  contents: read

jobs:
  habit-evidence-core:
    name: HabitEvidenceCore Swift Testing
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Test HabitEvidenceCore
        run: swift test --package-path samples/HabitEvidenceCore
      - name: Test CivilDayCore
        run: swift test --package-path samples/CivilDayCore
